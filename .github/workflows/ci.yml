name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-local-only-not-a-production-secret
      POSTGRES_DB: chinese_learning
      APP_ENV: test
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://postgres:ci-local-only-not-a-production-secret@127.0.0.1:5432/chinese_learning
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-local-only-not-a-production-secret@127.0.0.1:5432/chinese_learning_test
      SECRET_KEY: ci-only-signing-key-not-for-deployment-0123456789
      CORS_ORIGINS: http://127.0.0.1:4173
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start PostgreSQL and pgvector
        run: docker compose up -d --wait db

      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Migrate both databases and verify current heads
        working-directory: backend
        shell: bash
        run: |
          APP_ENV=development uv run alembic upgrade head
          APP_ENV=development uv run alembic current
          APP_ENV=development uv run python -m tests.step81.verify_database --environment development
          APP_ENV=development uv run alembic check
          APP_ENV=test uv run alembic upgrade head
          APP_ENV=test uv run alembic current
          APP_ENV=test uv run python -m tests.step81.verify_database --environment test
          APP_ENV=test uv run alembic check

      - name: Compile backend and run full backend suite
        working-directory: backend
        run: |
          uv run python -m compileall -q app
          uv run pytest -q

      - name: Run frontend lint, tests, and build
        working-directory: frontend
        run: |
          npm run lint
          npm run test -- --run
          npm run build

      - name: Verify generated API contract
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          APP_ENV=test DEBUG=false CORS_ORIGINS=http://127.0.0.1:4173 uv run python -m tests.step81.run_e2e_server > "$RUNNER_TEMP/step82-api-server.log" 2>&1 &
          server_pid=$!
          cleanup_server() {
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid"
              local wait_status=0
              if wait "$server_pid"; then
                wait_status=0
              else
                wait_status=$?
              fi
              if [[ "$wait_status" -ne 0 && "$wait_status" -ne 143 ]]; then
                return "$wait_status"
              fi
            fi
          }
          trap cleanup_server EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
            cat "$RUNNER_TEMP/step82-api-server.log"
            exit 1
          fi
          cd ../frontend
          npm run api:check

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run deterministic browser suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes --remove-orphans
