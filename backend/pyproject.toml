[project]
name = "trung-chinese-learning-backend"
version = "0.1.0"
description = "Backend foundation for the Trung Chinese Learning application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "pgvector>=0.3,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "pyjwt>=2.10,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "python-multipart>=0.0.20,<1.0",
    "pymupdf>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    "sentence-transformers==6.1.0",
    "transformers==5.18.0",
    "torch==2.14.1",
    "openai==3.20.0",
    "tiktoken==0.14.0",
    "httpx>=0.27,<1.0",
]

[dependency-groups]
dev = [
    "psutil>=6,<8",
    "pytest>=8.0,<9.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
